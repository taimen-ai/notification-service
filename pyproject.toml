[project]
name = "notification-service"
version = "0.1.0"
description = "Product-neutral notification service: send, route by recipient preferences, deliver over channels, web inbox"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.13",
    "control-plane-client",
    "fastapi>=0.115",
    "httpx>=0.28",
    "platform-auth-sdk>=0.1.0",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

# Соседние репозитории подключаются путём, как в control-plane: единого
# внутреннего индекса пакетов у платформы пока нет.
[tool.uv.sources]
platform-auth-sdk = { path = "../platform-auth-sdk", editable = true }
control-plane-client = { path = "../control-plane/client", editable = true }
control-plane = { path = "../control-plane", editable = true }

[dependency-groups]
dev = [
    "aiosmtpd>=1.4",
    # Contract-тесты сверяют адаптер каталога с моделями API ядра.
    "control-plane",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
notification-service = "notification_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Документация и docstrings могут быть по-русски, поэтому проверки на «похожие»
# символы кириллицы отключены; B008 — идиома Depends() в FastAPI.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
